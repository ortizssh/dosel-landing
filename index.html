<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosel — El Hi-Fi explicado, diseñado y construido por ti.</title>
<meta name="description" content="Dosel — HiFi diseñado y construido en Chile. El sonido de alta fidelidad explicado, diseñado y armado por ti. Próximamente.">
<meta name="theme-color" content="#0A0A0A">

<meta property="og:title" content="Dosel — El Hi-Fi explicado, diseñado y construido por ti">
<meta property="og:description" content="HiFi DIY y ensamblado, diseñado en Chile. Próximamente.">
<meta property="og:type" content="website">
<meta property="og:image" content="/og.png">

<link rel="icon" type="image/svg+xml" href="/isotype.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #0A0A0A;
    --paper: #FAFAFA;
    --mute: rgba(250, 250, 250, 0.55);
  }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }

  .center img {
    width: 100%;
    max-width: 320px;
    height: auto;
    display: block;
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.025;
    mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: clamp(16px, 3vw, 32px) clamp(20px, 4vw, 48px);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mute);
  }

  footer a {
    color: var(--paper);
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
  }

  footer a:hover {
    opacity: 1;
  }

  footer .foot-col {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  @media (max-width: 600px) {
    footer { gap: 16px; }
    footer .foot-col { gap: 18px; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="grain"></div>

<div class="center">
  <img src="logo.svg" alt="Dosel">
</div>

<footer>
  <div class="foot-col">
    <span>© 2026 Dosel Audio</span>
  </div>
  <div class="foot-col">
    <a href="mailto:info@doselaudio.com">info@doselaudio.com</a>
    <a href="https://instagram.com/dosel.audio" target="_blank" rel="noopener" aria-label="Instagram @dosel.audio">@dosel.audio</a>
  </div>
</footer>

</body>
</html>
